<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Login</title>
    <link rel="stylesheet" href="style.css">
</head>
<body>
    <!--color hexadecimal del boton texto : #DD4A1F-->
    <div  class="login-container">
        <div class="login-box">
            <div class="left-panel">
                <div class="logo"> 
                    <img src="logo.svg">
                </div>
                <h2>Login</h2>
                <p class="signup-text">Don´t have a account? <a href="#">Get SeedProd Now</a></p>
                

                <form id="LoginForm">
                    <label for="email">Email Address</label>
                    <input type="email" id="email" placeholder="Enter your email" required>
                    
                    
                    <label for="password">password</label>
                    <div class="password-field">
                    <input type="password" id="password" placeholder="Enter your password" required>
                    
                    </div>


                    <div class="remember-me">
                        <input type="checkbox" id="remember-me">
                        <label for="remember">Remember Me</label>
                    </div>

                    <button type="submit" class="btn">Log In</button>

                    <a href="#" class="forgot-password">Forgot Your Password?</a>
                </form>
                

                <footer>
                    <p>Copyright © 2019 SeedProd, LLC. SeedProd™ is a trademark of seedprod, LLC.</p>
                    <p><a href="#">Terms of Service</a> | <a href="#">Privacy policy</a></p>  
                </footer>
            </div>

            <div class="rigth-panel">
                <img src="cohete.png" alt="imagen cohete">
            </div>
        </div>
    </div>
<script src="script.js"></script>
</body>
</html>
